spring.application.name=mentor-backend
server.port=${SERVER_PORT:8080}
mentor.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.paths-to-match=/api/v1/**

# PostgreSQL: SPRING_DATASOURCE_* process variables override these defaults.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:mentor}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:mentor}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway owns versioned schema changes; Hibernate must not create/update tables.
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.fail-on-missing-locations=true

# Spring Boot 4 MongoDB connection properties. Discrete credentials need no URI encoding.
spring.mongodb.host=${MONGO_HOST:localhost}
spring.mongodb.port=${MONGO_PORT:27017}
spring.mongodb.database=${MONGO_DB:mentor}
spring.mongodb.username=${MONGO_USER:mentor}
spring.mongodb.password=${MONGO_PASSWORD:}
spring.mongodb.authentication-database=${MONGO_AUTH_DATABASE:admin}
