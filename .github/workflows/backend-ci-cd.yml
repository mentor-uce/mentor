name: Backend CI/CD

# CI: runs on every Pull Request to develop or main (build + tests).
# CD: runs when a Pull Request is merged (push) into develop (QA) or main (production).
#     develop: build the image once, tag it with the commit, push it to Docker Hub, deploy it to QA (ECS Fargate).
#     main:    promote the SAME image that was validated in QA (no rebuild) and deploy it to production (ECS Fargate).
#              Production waits for the manual approval configured in the "production" environment.
#     Every external step is skipped with a notice while its secrets or variables are missing.

on:
  pull_request:
    branches: [develop, main]
    paths: ['backend/**', '.github/workflows/backend-ci-cd.yml']
  push:
    branches: [develop, main]
    paths: ['backend/**', '.github/workflows/backend-ci-cd.yml']
  workflow_dispatch:

concurrency:
  group: backend-ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Monorepo: the backend lives in backend. Jobs that do not check out the code (CI passed, deploys) override this.
defaults:
  run:
    working-directory: backend

jobs:
  # ---------------- CI ----------------
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if the Spring Boot project exists
        id: exists
        run: |
          if [ -f pom.xml ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; echo "No pom.xml yet, skipping."; fi

      - name: Set up Java 21
        if: steps.exists.outputs.found == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build and test (JUnit)
        if: steps.exists.outputs.found == 'true'
        run: mvn -B verify

      - name: Verify local Keycloak realm and PKCE
        if: steps.exists.outputs.found == 'true'
        run: python3 scripts/verify_keycloak.py --backend-jar target/mentor-backend-0.0.1-SNAPSHOT.jar --expect-me

      - name: Build the Docker image
        if: steps.exists.outputs.found == 'true'
        run: docker build -t mentor-backend:ci .

  docker-compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/; s/^MONGO_PASSWORD=$/MONGO_PASSWORD=ci/; s/^REDIS_PASSWORD=$/REDIS_PASSWORD=ci/; s/^KEYCLOAK_ADMIN_PASSWORD=$/KEYCLOAK_ADMIN_PASSWORD=ci/; s/^MENTOR_TEST_STUDENT_PASSWORD=$/MENTOR_TEST_STUDENT_PASSWORD=ci-student/; s/^MENTOR_TEST_TUTOR_PASSWORD=$/MENTOR_TEST_TUTOR_PASSWORD=ci-tutor/; s/^MENTOR_TEST_ADMIN_PASSWORD=$/MENTOR_TEST_ADMIN_PASSWORD=ci-admin/' .env
          docker compose --profile app --profile automation config --quiet

  ci-ok:
    name: CI passed
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    needs: [backend, docker-compose]
    steps:
      - run: echo "All CI checks passed."

  # ---------------- CD ----------------
  publish-image:
    name: Publish image to Docker Hub
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: ci-ok
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Check the Docker Hub configuration
        id: cfg
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not configured yet. Skipping the image publication."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.configured == 'true'

      - name: Log in to Docker Hub
        if: steps.cfg.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the image (tagged with the commit)
        if: steps.cfg.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/mentor-backend:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/mentor-backend:qa

  deploy-qa:
    name: Deploy to QA
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: .
    environment: qa
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE_BACKEND }}
      IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/mentor-backend:${{ github.sha }}
    steps:
      - name: Check the AWS configuration
        id: cfg
        run: |
          if [ -z "$AWS_ROLE_ARN" ] || [ -z "$AWS_REGION" ] || [ -z "$ECS_CLUSTER" ] || [ -z "$ECS_SERVICE" ] || [ -z "${{ vars.DOCKERHUB_USERNAME }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "AWS_ROLE_ARN / AWS_REGION / ECS_CLUSTER / ECS_SERVICE_BACKEND are not configured in the qa environment yet. Skipping the deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.cfg.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy the image to ECS Fargate
        if: steps.cfg.outputs.configured == 'true'
        run: |
          TASK_DEF_ARN=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition --task-definition "$TASK_DEF_ARN" --query taskDefinition \
            | jq --arg IMAGE "$IMAGE" '.containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' > taskdef.json
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json file://taskdef.json --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "$NEW_ARN" > /dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

  deploy-production:
    name: Deploy to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci-ok
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: .
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE_BACKEND }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Check the configuration
        id: cfg
        run: |
          if [ -z "$AWS_ROLE_ARN" ] || [ -z "$AWS_REGION" ] || [ -z "$ECS_CLUSTER" ] || [ -z "$ECS_SERVICE" ] || [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "AWS and Docker Hub are not configured in the production environment yet. Skipping the deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.configured == 'true'
        with:
          fetch-depth: 2

      - name: Find the image validated in QA
        if: steps.cfg.outputs.configured == 'true'
        run: |
          # main receives develop through a merge commit: its second parent is the develop commit already built and tested in QA.
          PROMOTED_SHA=$(git rev-parse --verify -q HEAD^2 || git rev-parse HEAD)
          echo "PROMOTED_SHA=$PROMOTED_SHA" >> "$GITHUB_ENV"
          echo "IMAGE=$DOCKERHUB_USERNAME/mentor-backend:$PROMOTED_SHA" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        if: steps.cfg.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag the same image as production (no rebuild)
        if: steps.cfg.outputs.configured == 'true'
        run: docker buildx imagetools create -t "$DOCKERHUB_USERNAME/mentor-backend:production" "$IMAGE"

      - name: Configure AWS credentials (OIDC)
        if: steps.cfg.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy the image to ECS Fargate
        if: steps.cfg.outputs.configured == 'true'
        run: |
          TASK_DEF_ARN=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition --task-definition "$TASK_DEF_ARN" --query taskDefinition \
            | jq --arg IMAGE "$IMAGE" '.containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' > taskdef.json
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json file://taskdef.json --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "$NEW_ARN" > /dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
