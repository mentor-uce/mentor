name: Backend CI/CD

# CI: runs on every Pull Request to develop or main (build + tests).
# CD: runs when a Pull Request is merged (push) into develop (QA) or main (production).
#     Production waits for the manual approval configured in the "production" environment.

on:
  pull_request:
    branches: [develop, main]
    paths: ['backend/**', '.github/workflows/backend-ci-cd.yml']
  push:
    branches: [develop, main]
    paths: ['backend/**', '.github/workflows/backend-ci-cd.yml']
  workflow_dispatch:

concurrency:
  group: backend-ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Monorepo: the backend lives in backend. Jobs that do not check out the code (CI passed, deploys) override this.
defaults:
  run:
    working-directory: backend

jobs:
  # ---------------- CI ----------------
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if the Spring Boot project exists
        id: exists
        run: |
          if [ -f pom.xml ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; echo "No pom.xml yet, skipping."; fi

      - name: Set up Java 21
        if: steps.exists.outputs.found == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build and test (JUnit)
        if: steps.exists.outputs.found == 'true'
        run: mvn -B verify

      - name: Verify local Keycloak realm and PKCE
        if: steps.exists.outputs.found == 'true'
        run: python3 scripts/verify_keycloak.py

      - name: Build the Docker image
        if: steps.exists.outputs.found == 'true'
        run: docker build -t mentor-backend:ci .

  docker-compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/; s/^MONGO_PASSWORD=$/MONGO_PASSWORD=ci/; s/^REDIS_PASSWORD=$/REDIS_PASSWORD=ci/; s/^KEYCLOAK_ADMIN_PASSWORD=$/KEYCLOAK_ADMIN_PASSWORD=ci/; s/^MENTOR_TEST_STUDENT_PASSWORD=$/MENTOR_TEST_STUDENT_PASSWORD=ci-student/; s/^MENTOR_TEST_TUTOR_PASSWORD=$/MENTOR_TEST_TUTOR_PASSWORD=ci-tutor/; s/^MENTOR_TEST_ADMIN_PASSWORD=$/MENTOR_TEST_ADMIN_PASSWORD=ci-admin/' .env
          docker compose --profile app --profile automation config --quiet

  ci-ok:
    name: CI passed
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    needs: [backend, docker-compose]
    steps:
      - run: echo "All CI checks passed."

  # ---------------- CD ----------------
  deploy-qa:
    name: Deploy to QA
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: ci-ok
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    environment: qa
    steps:
      - name: Trigger deploy on Render
        env:
          RENDER_DEPLOY_HOOK_BACKEND: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_BACKEND" ]; then
            echo "RENDER_DEPLOY_HOOK_BACKEND is not configured in the qa environment yet. Skipping."
          else
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_BACKEND"
          fi

  deploy-production:
    name: Deploy to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci-ok
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    environment: production
    steps:
      - name: Trigger deploy on Render
        env:
          RENDER_DEPLOY_HOOK_BACKEND: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_BACKEND" ]; then
            echo "RENDER_DEPLOY_HOOK_BACKEND is not configured in the production environment yet. Skipping."
          else
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_BACKEND"
          fi
