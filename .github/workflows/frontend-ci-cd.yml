name: Frontend CI/CD

# CI: runs on every Pull Request to develop or main (lint, tests and build).
# CD: runs when a Pull Request is merged (push) into develop (QA) or main (production).
#     Production waits for the manual approval configured in the "production" environment.

on:
  pull_request:
    branches: [develop, main]
    paths: ['frontend/**', '.github/workflows/frontend-ci-cd.yml']
  push:
    branches: [develop, main]
    paths: ['frontend/**', '.github/workflows/frontend-ci-cd.yml']
  workflow_dispatch:

concurrency:
  group: frontend-ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------- CI ----------------
  web:
    name: Web app (React + Vite)
    runs-on: ubuntu-latest
    # Monorepo: the web shell lives in frontend/web
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4

      - name: Check if the web app project exists
        id: exists
        run: |
          if [ -f package.json ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; echo "No package.json yet, skipping."; fi

      - name: Set up Node.js 20
        if: steps.exists.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install, lint, test (Vitest) and build
        if: steps.exists.outputs.found == 'true'
        run: |
          npm ci
          npm run lint --if-present
          npm test --if-present -- --run
          npm run build

  landing:
    name: Landing (Astro)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if the landing project exists
        id: exists
        run: |
          if [ -f frontend/landing/package.json ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; echo "No frontend/landing/package.json yet, skipping."; fi

      - name: Set up Node.js 20
        if: steps.exists.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/landing/package-lock.json

      - name: Install and build
        if: steps.exists.outputs.found == 'true'
        working-directory: frontend/landing
        run: |
          npm ci
          npm run build

  ci-ok:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [web, landing]
    steps:
      - run: echo "All CI checks passed."

  # ---------------- CD ----------------
  deploy-qa:
    name: Deploy to QA
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: ci-ok
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - name: Trigger deploy of the web app and landing page
        env:
          FRONTEND_DEPLOY_HOOK: ${{ secrets.FRONTEND_DEPLOY_HOOK }}
        run: |
          if [ -z "$FRONTEND_DEPLOY_HOOK" ]; then
            echo "FRONTEND_DEPLOY_HOOK is not configured in the qa environment yet. Skipping."
          else
            curl -fsS -X POST "$FRONTEND_DEPLOY_HOOK"
          fi

  deploy-production:
    name: Deploy to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci-ok
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger deploy of the web app and landing page
        env:
          FRONTEND_DEPLOY_HOOK: ${{ secrets.FRONTEND_DEPLOY_HOOK }}
        run: |
          if [ -z "$FRONTEND_DEPLOY_HOOK" ]; then
            echo "FRONTEND_DEPLOY_HOOK is not configured in the production environment yet. Skipping."
          else
            curl -fsS -X POST "$FRONTEND_DEPLOY_HOOK"
          fi
